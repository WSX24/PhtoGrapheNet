<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影瞬间 · 摄影作品集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo">光影瞬间</a>
            <nav class="nav">
                <a href="#gallery">作品</a>
                <a href="#about">关于</a>
                <a href="#contact">联系</a>
            </nav>
            <button class="admin-trigger" id="adminTrigger">管理</button>
        </div>
    </header>

    <section class="hero">
        <h1>用镜头捕捉世界的温度</h1>
        <p>风光 · 人像 · 街拍 · 静物</p>
        <a href="#gallery" class="btn">浏览作品</a>
    </section>

    <section id="gallery" class="gallery-section">
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="landscape">风光</button>
            <button class="filter-btn" data-filter="portrait">人像</button>
            <button class="filter-btn" data-filter="street">街拍</button>
            <button class="filter-btn" data-filter="still">静物</button>
        </div>
        <div class="gallery-empty" id="galleryEmpty" style="display:none">
            <p>暂无作品</p>
            <p>点击右下角管理按钮上传你的第一张照片</p>
        </div>
        <div class="gallery" id="galleryGrid"></div>
    </section>

    <section id="about" class="about-section">
        <div class="about-content">
            <h2>关于我</h2>
            <p>热爱摄影多年，走遍山川湖海，用镜头记录下每一个动人的瞬间。擅长风光摄影与人像摄影，追求光影与构图的完美平衡。</p>
            <p>每一张照片，都是时光的标本。</p>
        </div>
    </section>

    <section id="contact" class="contact-section">
        <h2>联系方式</h2>
        <div class="contact-links">
            <a href="mailto:photographer@example.com">Email</a>
            <span class="divider">·</span>
            <a href="#">Instagram</a>
            <span class="divider">·</span>
            <a href="#">500px</a>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 光影瞬间. All rights reserved.</p>
    </footer>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <span class="lightbox-prev" id="lightboxPrev">&#10094;</span>
        <span class="lightbox-next" id="lightboxNext">&#10095;</span>
        <div class="lightbox-content">
            <img src="" alt="" id="lightboxImg">
        </div>
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <!-- ===== Admin Panel ===== -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel" id="adminPanel">

            <!-- Login -->
            <div class="admin-login" id="adminLogin">
                <h2>管理登录</h2>
                <form id="loginForm">
                    <input type="password" id="loginPassword" placeholder="请输入管理密码" required>
                    <button type="submit" class="btn btn-sm">进入管理</button>
                </form>
                <button class="btn-close" id="adminClose">&times;</button>
            </div>

            <!-- Dashboard -->
            <div class="admin-dashboard" id="adminDashboard" style="display:none">
                <div class="admin-header">
                    <h2>作品管理</h2>
                    <div class="admin-actions">
                        <button class="btn btn-sm" id="btnExport">导出数据</button>
                        <label class="btn btn-sm btn-import">
                            导入数据
                            <input type="file" id="importFile" accept=".json" hidden>
                        </label>
                        <button class="btn btn-sm btn-danger" id="btnReset">重置演示数据</button>
                        <button class="btn btn-sm" id="btnLogout">退出</button>
                    </div>
                </div>

                <!-- Upload Form -->
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-preview" id="uploadPreview">
                        <span>点击或拖拽上传</span>
                    </div>
                    <input type="file" id="uploadInput" accept="image/*" hidden>
                    <div class="upload-fields">
                        <input type="text" id="uploadTitle" placeholder="作品标题">
                        <select id="uploadCategory">
                            <option value="landscape">风光</option>
                            <option value="portrait">人像</option>
                            <option value="street">街拍</option>
                            <option value="still">静物</option>
                        </select>
                        <button class="btn btn-sm" id="btnUpload" disabled>上传作品</button>
                    </div>
                </div>

                <!-- Photo List -->
                <div class="photo-list" id="photoList">
                    <p class="list-empty">暂无作品，请上传</p>
                </div>

                <button class="btn-close" id="adminDashboardClose">&times;</button>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
